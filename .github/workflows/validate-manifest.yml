name: Validate manifest version policy

on:
  pull_request:
    paths:
      - manifest.json
      - scripts/validate-manifest
      - .github/workflows/validate-manifest.yml
  # Also run on main so a bypassed or force-pushed change still raises a signal.
  push:
    branches:
      - main
    paths:
      - manifest.json

permissions:
  contents: read

jobs:
  validate:
    name: Check shipped versions against the policy
    runs-on: ubuntu-latest
    # Escape hatch: label the PR `skip-version-policy` when a release genuinely
    # cannot wait for the manifest to be tidied up.
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'skip-version-policy')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate manifest.json
        shell: bash
        run: |
          chmod +x ./scripts/validate-manifest
          ./scripts/validate-manifest

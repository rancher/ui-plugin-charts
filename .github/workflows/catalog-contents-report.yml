name: Catalog checks

# manifest.json lists everything published to the GitHub Helm repo. The airgap
# catalog image ships a policy-filtered subset of it, so a one-line manifest diff
# can silently add or drop versions from the image. Two jobs:
#
#   report - what this PR does to the image contents (seconds)
#   build  - the real catalog build, stopping before the push (~4-5 min)
#
# The report is informational: there is no invalid manifest to reject, since the
# filter turns whatever is in the manifest into a valid catalog. The build is the
# one that can genuinely fail, and it is cheap enough to run here rather than
# discovering the problem during a release.

on:
  pull_request:
    paths:
      - manifest.json
      - scripts/catalog-versions
      - scripts/catalog-report
      - scripts/test-catalog-versions
      - scripts/bundle-catalog
      - .github/workflows/catalog-contents-report.yml
      - .github/workflows/catalog-build-dry-run.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: Report catalog image contents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the base commit too, to resolve what the catalog ships today.
          fetch-depth: 0

      - name: Test the resolver
        shell: bash
        run: |
          chmod +x ./scripts/catalog-versions ./scripts/test-catalog-versions
          ./scripts/test-catalog-versions

      - name: Build the report
        shell: bash
        run: |
          chmod +x ./scripts/catalog-report
          git show "origin/${{ github.base_ref }}:manifest.json" > /tmp/base-manifest.json
          ./scripts/catalog-report /tmp/base-manifest.json ./manifest.json | tee /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        # Pull requests from forks do not get write permissions, so this cannot
        # post there. The job summary above always has the same content.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          # Keep one comment per PR rather than a new one on every push.
          MARKER="<!-- catalog-contents-report -->"
          printf '%s\n%s\n' "${MARKER}" "$(cat /tmp/report.md)" > /tmp/comment.md

          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -n 1)

          if [[ -n "${EXISTING}" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -F body=@/tmp/comment.md >/dev/null
            echo "Updated existing comment ${EXISTING}"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR}/comments" \
              -F body=@/tmp/comment.md >/dev/null
            echo "Posted new comment"
          fi

  build:
    name: Catalog build
    # Same job the scheduled run uses, so a PR exercises exactly what a release
    # will do - no second copy of the build steps to drift.
    uses: ./.github/workflows/catalog-build-dry-run.yml
